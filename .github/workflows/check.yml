name: Check addon
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4
      - name: Validate Lua syntax
        run: |
          for source in MYCRadar/*.lua tests/*.lua; do
            luac5.1 -p "$source"
            luac5.4 -p "$source"
          done
      - name: Simulate multiple guild clients
        run: |
          lua5.1 tests/run.lua
          lua5.4 tests/run.lua
      - name: Verify installable ZIP
        run: python3 scripts/package.py --check
